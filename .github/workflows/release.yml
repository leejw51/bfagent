name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (aarch64-apple-darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build deps
        run: python -m pip install --upgrade pip build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # ── Build all three binaries via the app Makefile ─────────────────
      - name: Build binaries
        working-directory: app
        run: make package

      # ── Import codesigning certificate ────────────────────────────────
      - name: Import codesigning certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          CERT_INFO=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" || true)
          if [ -n "$CERT_INFO" ]; then
            CERT_ID=$(echo "$CERT_INFO" | head -1 | awk -F'"' '{print $2}')
            echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> $GITHUB_ENV
            echo "Found certificate: $CERT_ID"
          else
            echo "::warning::No Developer ID Application certificate found, using ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> $GITHUB_ENV
          fi

      # ── JIT entitlements for the Tauri/wry WKWebView binary ──────────
      - name: Create entitlements
        run: |
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.cs.allow-jit bool true" entitlements.plist
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.cs.allow-unsigned-executable-memory bool true" entitlements.plist
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.cs.disable-library-validation bool true" entitlements.plist

      # ── Sign all three binaries ──────────────────────────────────────
      - name: Codesign binaries
        run: |
          BFAGENT="app/bin/bfagent"
          BFAGENT_CLI="app/bin/bfagent-cli"
          BFAGENT_APP="app/bin/bfagent-app"

          codesign --force --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            "$BFAGENT"

          codesign --force --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            "$BFAGENT_CLI"

          codesign --force --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements entitlements.plist \
            --timestamp \
            "$BFAGENT_APP"

          echo "Signed bfagent:"
          codesign -dv --verbose=2 "$BFAGENT" 2>&1 | head -5
          echo "Signed bfagent-cli:"
          codesign -dv --verbose=2 "$BFAGENT_CLI" 2>&1 | head -5
          echo "Signed bfagent-app:"
          codesign -dv --verbose=2 "$BFAGENT_APP" 2>&1 | head -5

      # ── Notarize all three in one submission ─────────────────────────
      - name: Notarize binaries
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/notarize"
          cp app/bin/bfagent app/bin/bfagent-cli app/bin/bfagent-app "$RUNNER_TEMP/notarize/"
          (cd "$RUNNER_TEMP/notarize" && zip -r "$RUNNER_TEMP/notarize-bundle.zip" .)

          echo "Submitting bundle for notarization..."
          xcrun notarytool submit "$RUNNER_TEMP/notarize-bundle.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait --timeout 20m

          # Stapling raw Mach-O binaries is unsupported; Gatekeeper looks
          # the ticket up online on first launch. Best-effort attempts:
          xcrun stapler staple app/bin/bfagent 2>/dev/null || echo "Staple skipped for bfagent"
          xcrun stapler staple app/bin/bfagent-cli 2>/dev/null || echo "Staple skipped for bfagent-cli"
          xcrun stapler staple app/bin/bfagent-app 2>/dev/null || echo "Staple skipped for bfagent-app"

      # ── Package final distribution zip ───────────────────────────────
      - name: Package release zip
        run: |
          mkdir -p dist/staging
          cp app/bin/bfagent       dist/staging/bfagent
          cp app/bin/bfagent-cli   dist/staging/bfagent-cli
          cp app/bin/bfagent-app   dist/staging/bfagent-app
          chmod +x dist/staging/bfagent dist/staging/bfagent-cli dist/staging/bfagent-app
          (cd dist/staging && zip "../bfagent-macos-arm64.zip" bfagent bfagent-cli bfagent-app)
          rm -rf dist/staging

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bfagent-macos-arm64
          path: dist/bfagent-macos-arm64.zip

      # ── Cleanup keychain ─────────────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bfagent-macos-arm64
          path: release

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
